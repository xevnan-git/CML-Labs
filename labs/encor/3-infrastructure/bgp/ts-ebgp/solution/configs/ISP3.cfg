hostname ISP3
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
interface Loopback0
 ip address 10.255.255.103 255.255.255.255
!
interface Loopback1
 description simulated internet prefix
 ip address 203.0.113.1 255.255.255.0
!
interface Ethernet0/0
 description ISP1 e0/1 (AS 64511)
 ip address 10.101.103.103 255.255.255.0
 no shutdown
!
interface Ethernet0/1
 description ISP2 e0/1 (AS 64512)
 ip address 10.102.103.103 255.255.255.0
 no shutdown
!
interface Ethernet0/2
 description PC2 LAN (internet host)
 ip address 198.51.100.1 255.255.255.0
 no shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router bgp 64513
 bgp router-id 10.255.255.103
 bgp log-neighbor-changes
 neighbor 10.101.103.101 remote-as 64511
 neighbor 10.101.103.101 description ISP1
 neighbor 10.102.103.102 remote-as 64512
 neighbor 10.102.103.102 description ISP2
 network 10.255.255.103 mask 255.255.255.255
 network 198.51.100.0
 network 203.0.113.0
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input ssh telnet
!
end
