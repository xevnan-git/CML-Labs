hostname SW2
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
vtp domain LAB
vtp mode transparent
!
vlan 10
 name SALES
vlan 20
 name ENGINEERING
vlan 99
 name MGMT
vlan 999
 name NATIVE-UNUSED
!
spanning-tree mode rapid-pvst
spanning-tree vlan 1,10,20,99 priority 8192
!
interface Port-channel1
 description to SW1 Po1 (LACP)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
!
interface Port-channel3
 description to SW4 Po3 (PAgP)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
!
interface Ethernet0/0
 description to SW1 e0/0 (Po1)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 1 mode active
 no shutdown
!
interface Ethernet0/1
 description to SW1 e0/1 (Po1)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 1 mode active
 no shutdown
!
interface Ethernet0/2
 description to SW3 e0/2 (DTP)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode dynamic desirable
 no shutdown
!
interface Ethernet1/0
 description to SW4 e0/0 (Po3)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 3 mode desirable
 no shutdown
!
interface Ethernet1/1
 description to SW4 e0/1 (Po3)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 3 mode desirable
 no shutdown
!
interface Ethernet0/3
 shutdown
!
interface Ethernet1/2
 shutdown
!
interface Ethernet1/3
 shutdown
!
interface Vlan99
 ip address 192.168.99.202 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input ssh telnet
!
end
