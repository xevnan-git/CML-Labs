hostname R3
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
interface Loopback0
 ip address 10.255.255.3 255.255.255.255
 ip ospf 1 area 0
!
interface Loopback1
 description data-center server
 ip address 172.16.0.100 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description R1 e0/2
 ip address 10.1.3.3 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/1
 description R2 e0/2
 ip address 10.2.3.3 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.3
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input telnet ssh
!
end
