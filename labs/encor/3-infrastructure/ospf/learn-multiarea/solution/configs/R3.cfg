hostname R3
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
interface Loopback0
 ip address 10.255.255.3 255.255.255.255
 ip ospf 1 area 0
!
interface Loopback1
 description simulated external network
 ip address 203.0.113.1 255.255.255.0
!
interface Ethernet0/0
 description AREA0 segment (SW0)
 ip address 10.0.1.3 255.255.255.0
 ip ospf 1 area 0
 ip ospf priority 255
 no shutdown
!
interface Ethernet0/1
 no ip address
 shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
route-map R3-EXTERNAL permit 10
 match interface Loopback1
!
router ospf 1
 router-id 10.255.255.3
 redistribute connected subnets route-map R3-EXTERNAL
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input ssh telnet
!
end
