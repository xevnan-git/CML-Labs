hostname R1
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
ip multicast-routing
!
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
 ip pim sparse-mode
 ip ospf 1 area 0
!
interface Ethernet0/0
 description LAN10 source (SRV1)
 ip address 192.168.10.1 255.255.255.0
 ip pim sparse-mode
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/1
 description R2 e0/0
 ip address 10.1.2.1 255.255.255.0
 ip pim sparse-mode
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description R3 e0/1
 ip address 10.1.3.1 255.255.255.0
 ip pim sparse-mode
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.1
 passive-interface Ethernet0/0
!
ip access-list standard BIDIR-GROUPS
 permit 239.2.0.0 0.0.255.255
!
ip pim bidir-enable
ip pim rp-address 10.255.255.2
ip pim rp-address 10.255.255.1 BIDIR-GROUPS bidir
ip pim ssm default
!
ip msdp peer 10.255.255.2 connect-source Loopback0
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input telnet ssh
!
end
