hostname R3
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
interface Loopback0
 ip address 10.255.255.3 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description R1 e0/1 (slow path)
 bandwidth 5000
 ip address 10.1.3.3 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/1
 description R4 e0/1
 ip address 10.3.4.3 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.3
!
router eigrp LAB
 !
 address-family ipv4 unicast autonomous-system 100
  !
  topology base
  exit-af-topology
  network 10.0.0.0
  eigrp router-id 10.255.255.3
 exit-address-family
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input ssh telnet
!
end
