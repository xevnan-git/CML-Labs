- id: n4
  label: SRV1
  x: 300
  y: 0
  node_definition: alpine
  image_definition: alpine-base-3-23-3
  interfaces:
  - id: i0
    label: eth0
    slot: 0
    type: physical
  configuration:
  - name: node.cfg
    content: |
      # this is a shell script which will be sourced at boot
      hostname SRV1
      USERNAME=cisco
      PASSWORD=cisco
      ip address add 192.168.50.10/24 dev eth0
      ip link set dev eth0 up
      ip route add default via 192.168.50.1
      mkdir -p /srv/www
      echo '<h1>SRV1 intranet</h1>' > /srv/www/index.html
      /usr/sbin/httpd -p 80 -h /srv/www
