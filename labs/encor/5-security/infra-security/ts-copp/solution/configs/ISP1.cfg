hostname ISP1
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
crypto key generate rsa modulus 2048
!
interface Loopback0
 ip address 10.255.255.101 255.255.255.255
!
interface Ethernet0/0
 description customer R1 e0/1 (AS 65001)
 ip address 10.1.101.101 255.255.255.0
 no shutdown
!
interface Ethernet0/1
 description PC2 LAN (internet host)
 ip address 198.51.100.1 255.255.255.0
 no shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router bgp 64511
 bgp router-id 10.255.255.101
 bgp log-neighbor-changes
 neighbor 10.1.101.1 remote-as 65001
 neighbor 10.1.101.1 description customer R1
 neighbor 10.1.101.1 transport connection-mode passive
 neighbor 10.1.101.1 timers 10 30
 network 10.255.255.101 mask 255.255.255.255
 network 198.51.100.0
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input ssh telnet
!
end
