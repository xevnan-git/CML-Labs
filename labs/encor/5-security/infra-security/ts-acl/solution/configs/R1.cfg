hostname R1
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
crypto key generate rsa modulus 2048
!
ip access-list standard VTY-ADMIN
 10 permit 192.168.10.0 0.0.0.255
!
ip access-list extended CONTRACTORS-IN
 10 permit tcp 192.168.11.0 0.0.0.255 host 192.168.50.10 eq www
 20 permit icmp 192.168.11.0 0.0.0.255 host 192.168.50.10 echo
 30 deny ip 192.168.11.0 0.0.0.255 192.168.50.0 0.0.0.255 log
 40 permit ip 192.168.11.0 0.0.0.255 any
!
ip access-list extended BRANCH-IN
 10 permit ospf any any
 20 permit tcp any 192.168.10.0 0.0.1.255 established
 30 permit icmp any any
 40 deny ip any any log
!
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description HQ R2 e0/0
 ip address 10.1.2.1 255.255.255.0
 ip ospf 1 area 0
 ip access-group BRANCH-IN in
 no shutdown
!
interface Ethernet0/1
 description VLAN 10 Staff (PC1)
 ip address 192.168.10.1 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description VLAN 11 Contractors (PC2)
 ip address 192.168.11.1 255.255.255.0
 ip ospf 1 area 0
 ip access-group CONTRACTORS-IN in
 no shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.1
 passive-interface Ethernet0/1
 passive-interface Ethernet0/2
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input ssh telnet
 access-class VTY-ADMIN in
!
end
