hostname R2
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
fhrp version vrrp v3
track 1 ip route 10.255.255.3 255.255.255.255 reachability
!
interface Loopback0
 ip address 10.255.255.2 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description LAN10 staff (PC1) via SW1
 ip address 192.168.10.3 255.255.255.0
 ip ospf 1 area 0
 standby version 2
 standby 10 ip 192.168.10.1
 standby 10 timers 1 3
 standby 10 preempt
 standby 10 authentication md5 key-string FHRPsecret
 no shutdown
!
interface Ethernet0/1
 description LAN20 lab (PC2) via SW2
 ip address 192.168.20.3 255.255.255.0
 ip ospf 1 area 0
 vrrp 20 address-family ipv4
  priority 110
  track 1 decrement 20
  address 192.168.20.1 primary
  exit-vrrp
 no shutdown
!
interface Ethernet0/2
 description uplink R3 e0/1
 ip address 10.2.3.2 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.2
 passive-interface Ethernet0/0
 passive-interface Ethernet0/1
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input telnet ssh
!
end
