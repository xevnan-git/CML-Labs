hostname ISP2
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
interface Loopback0
 ip address 10.255.255.102 255.255.255.255
!
interface Ethernet0/0
 description customer R1 e0/1 (AS 65001)
 ip address 10.1.102.102 255.255.255.0
 no shutdown
!
interface Ethernet0/1
 description ISP3 e0/1 (AS 64513)
 ip address 10.102.103.102 255.255.255.0
 no shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router bgp 64512
 bgp router-id 10.255.255.102
 bgp log-neighbor-changes
 neighbor 10.1.102.1 remote-as 65001
 neighbor 10.1.102.1 description customer R1
 neighbor 10.1.102.1 password isp2peer
 neighbor 10.102.103.103 remote-as 64513
 neighbor 10.102.103.103 description ISP3
 network 10.255.255.102 mask 255.255.255.255
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input ssh telnet
!
end
