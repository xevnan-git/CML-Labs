    # Reference

    ## Lab access

    | Node | Type | Username | Password | Enable |
    |---|---|---|---|---|
    | NTP1 | IOL-XE router (stands in for an internet time source) | cisco | cisco | cisco |
    | R1, R2, R3 | IOL-XE routers | cisco | cisco | cisco |

    Open a console from the node in CML (right-click → Console). Routers start in privileged EXEC.
    Each node also has a label in the CML canvas with its login and addresses.

    ## Topology

    ```
                           NTP1   Lo0 10.255.255.100
                             | e0/0
                        10.1.100.0/24
                             | e0/0
                            R1    Lo0 10.255.255.1
                   e0/1   /    \   e0/2
             10.1.2.0/24 /      \ 10.1.3.0/24
                   e0/0 /        \ e0/0
                      R2 -------- R3
      Lo0 10.255.255.2  e0/1  e0/1  Lo0 10.255.255.3
                       10.2.3.0/24  Lo1 172.19.0.1/24 (not in OSPF)
    ```

    ## Addressing

    | Node | Interface | IPv4 | Connects to |
    |---|---|---|---|
    | NTP1 | Loopback0 | 10.255.255.100/32 | — |
    | NTP1 | Ethernet0/0 | 10.1.100.100/24 | R1 e0/0 |
    | R1 | Loopback0 | 10.255.255.1/32 | — |
    | R1 | Ethernet0/0 | 10.1.100.1/24 | NTP1 e0/0 |
    | R1 | Ethernet0/1 | 10.1.2.1/24 | R2 e0/0 |
    | R1 | Ethernet0/2 | 10.1.3.1/24 | R3 e0/0 |
    | R2 | Loopback0 | 10.255.255.2/32 | — |
    | R2 | Ethernet0/0 | 10.1.2.2/24 | R1 e0/1 |
    | R2 | Ethernet0/1 | 10.2.3.2/24 | R3 e0/1 |
    | R3 | Loopback0 | 10.255.255.3/32 | — |
    | R3 | Loopback1 | 172.19.0.1/24 | not in OSPF |
    | R3 | Ethernet0/0 | 10.1.3.3/24 | R1 e0/2 |
    | R3 | Ethernet0/1 | 10.2.3.3/24 | R2 e0/1 |

    All interfaces except R3's Loopback1 run OSPF area 0 (preconfigured).
  version: 0.3.0
nodes:
- id: n0
  label: NTP1
  x: 0
  y: -300
  node_definition: iol-xe
  image_definition: iol-xe-17-18-02
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  configuration:
  - name: ios_config.txt
    content: |
      hostname NTP1
      no ip domain lookup
      ip domain name lab.local
      enable secret cisco
      username cisco privilege 15 secret cisco
      !
      interface Loopback0
       description NTP service address
       ip address 10.255.255.100 255.255.255.255
       ip ospf 1 area 0
      !
      interface Ethernet0/0
       description R1 e0/0
       ip address 10.1.100.100 255.255.255.0
       ip ospf 1 area 0
       no shutdown
      !
      interface Ethernet0/1
       no ip address
       shutdown
      !
      interface Ethernet0/2
       no ip address
       shutdown
      !
      interface Ethernet0/3
       no ip address
       shutdown
      !
      router ospf 1
       router-id 10.255.255.100
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
       privilege level 15
      line vty 0 4
       login local
       transport input telnet ssh
      !
      end
