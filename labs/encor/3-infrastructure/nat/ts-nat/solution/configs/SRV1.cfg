# this is a shell script which will be sourced at boot
hostname SRV1
USERNAME=cisco
PASSWORD=cisco
ip address add 192.168.20.10/24 dev eth0
ip link set dev eth0 up
ip route add default via 192.168.20.1
mkdir -p /srv/www
echo '<h1>SRV1 public web server</h1>' > /srv/www/index.html
/usr/sbin/httpd -p 80 -h /srv/www
# monitoring heartbeat: one ping to the internet host every 10 seconds
(while true; do ping -c 1 -W 1 192.0.2.10 >/dev/null 2>&1; sleep 10; done) &
