hostname R6
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
interface Loopback0
 ip address 10.255.255.6 255.255.255.255
 ip ospf 1 area 2
!
interface Ethernet0/0
 description to R5 e0/1
 ip address 10.5.6.6 255.255.255.0
 ip ospf 1 area 2
 ip ospf network point-to-point
 no shutdown
!
interface Ethernet0/1
 description PC2 LAN
 ip address 192.168.20.1 255.255.255.0
 ip ospf 1 area 2
 no shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.6
 passive-interface Ethernet0/1
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input ssh telnet
!
end
