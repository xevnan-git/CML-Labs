hostname R1
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description R2 e0/0
 ip address 10.1.2.1 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/1
 description R3 e0/0 (slow path)
 bandwidth 5000
 ip address 10.1.3.1 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description PC1 LAN
 ip address 192.168.10.1 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.1
 passive-interface Ethernet0/2
!
router eigrp LAB
 !
 address-family ipv4 unicast autonomous-system 100
  !
  af-interface Ethernet0/2
   passive-interface
  exit-af-interface
  !
  topology base
   variance 2
  exit-af-topology
  network 10.0.0.0
  network 192.168.10.0
  eigrp router-id 10.255.255.1
 exit-address-family
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input ssh telnet
!
end
