hostname NTP1
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
clock timezone EST -5 0
clock summer-time EDT recurring
service timestamps log datetime msec localtime show-timezone
service timestamps debug datetime msec localtime show-timezone
!
interface Loopback0
 description NTP service address
 ip address 10.255.255.100 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description R1 e0/0
 ip address 10.1.100.100 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/1
 no ip address
 shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.100
!
ntp authentication-key 1 md5 NTPsecret
ntp authenticate
ntp trusted-key 1
ntp source Loopback0
ntp master 3
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input telnet ssh
!
end
