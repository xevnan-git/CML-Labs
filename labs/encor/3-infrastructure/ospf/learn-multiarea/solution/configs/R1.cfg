hostname R1
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description AREA0 segment (SW0)
 ip address 10.0.1.1 255.255.255.0
 ip ospf 1 area 0
 ip ospf priority 0
 no shutdown
!
interface Ethernet0/1
 description to R4 e0/0
 ip address 10.1.4.1 255.255.255.0
 ip ospf 1 area 1
 ip ospf network point-to-point
 no shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.1
 area 1 range 172.20.0.0 255.255.252.0
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input ssh telnet
!
end
