nodes:
- id: n0
  label: R1
  x: 0
  y: 0
  node_definition: iol-xe
  image_definition: iol-xe-17-18-02
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  configuration:
  - name: ios_config.txt
    content: |
      hostname R1
      no ip domain lookup
      ip domain name lab.local
      enable secret cisco
      username cisco privilege 15 secret cisco
      !
      interface Loopback0
       ip address 10.255.255.1 255.255.255.255
      !
      interface Ethernet0/0
       description VLAN 10 staff LAN (PC1)
       ip address 192.168.10.1 255.255.255.0
       no shutdown
      !
      interface Ethernet0/1
       description VLAN 20 guest LAN (PC2)
       ip address 192.168.20.1 255.255.255.0
       no shutdown
      !
      interface Ethernet0/2
       description ISP1 e0/0 (primary)
       ip address 10.1.101.1 255.255.255.0
       no shutdown
      !
      interface Ethernet0/3
       description ISP2 e0/0 (guest / backup)
       ip address 10.1.102.1 255.255.255.0
       no shutdown
      !
      ip route 0.0.0.0 0.0.0.0 10.1.101.101 name DEFAULT-VIA-ISP1
      ip route 203.0.113.0 255.255.255.0 10.1.101.101 name SAAS-VIA-ISP1
      !
      ip access-list extended GUEST-NET
       10 permit ip any 192.168.20.0 0.0.0.255
      ip access-list extended R1-LOOPBACK
       10 permit ip host 10.255.255.1 any
      !
      ip sla 1
       icmp-echo 10.1.102.201 source-interface Ethernet0/3
       frequency 5
      ip sla schedule 1 life forever start-time now
      !
      track 1 ip sla 1 reachability
      !
      route-map PBR-GUEST permit 10
       match ip address GUEST-NET
       set ip default next-hop 10.1.102.102
      !
      route-map PBR-LOCAL permit 10
       match ip address R1-LOOPBACK
       set ip next-hop 10.1.120.102
      !
      interface Ethernet0/3
       ip policy route-map PBR-GUEST
      !
      ip local policy route-map PBR-LOCAL
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
       privilege level 15
      line vty 0 4
       login local
       transport input telnet ssh
      !
      end
