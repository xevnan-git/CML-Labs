hostname SW1
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
vtp domain LAB
vtp mode transparent
!
vlan 10
 name SALES
vlan 20
 name ENGINEERING
vlan 99
 name MGMT
vlan 999
 name NATIVE-UNUSED
!
spanning-tree mode rapid-pvst
spanning-tree vlan 1,10,20,99 priority 4096
!
ip routing
!
interface Port-channel1
 description to SW2 Po1 (LACP)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
!
interface Port-channel2
 description to SW3 Po2 (LACP)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
!
interface Ethernet0/0
 description to SW2 e0/0 (Po1)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 1 mode active
 no shutdown
!
interface Ethernet0/1
 description to SW2 e0/1 (Po1)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 1 mode active
 no shutdown
!
interface Ethernet0/2
 description to SW3 e0/0 (Po2)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 2 mode active
 no shutdown
!
interface Ethernet0/3
 description to SW3 e0/1 (Po2)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 2 mode active
 no shutdown
!
interface Ethernet1/0
 description to SW4 e0/2 (static trunk)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 switchport nonegotiate
 no shutdown
!
interface Ethernet1/1
 shutdown
!
interface Ethernet1/2
 shutdown
!
interface Ethernet1/3
 shutdown
!
interface Vlan10
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
interface Vlan20
 ip address 192.168.20.1 255.255.255.0
 no shutdown
!
interface Vlan99
 ip address 192.168.99.1 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input ssh telnet
!
end
