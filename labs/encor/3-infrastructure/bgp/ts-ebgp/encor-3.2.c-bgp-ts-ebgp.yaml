nodes:
- id: n0
  label: R1
  x: -300
  y: 0
  node_definition: iol-xe
  image_definition: iol-xe-17-18-02
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  configuration:
  - name: ios_config.txt
    content: |
      hostname R1
      no ip domain lookup
      ip domain name lab.local
      enable secret cisco
      username cisco privilege 15 secret cisco
      !
      interface Loopback0
       ip address 10.255.255.1 255.255.255.255
      !
      interface Ethernet0/0
       description ISP1 (primary) e0/0
       ip address 10.1.101.1 255.255.255.0
       no shutdown
      !
      interface Ethernet0/1
       description ISP2 (backup) e0/0
       ip address 10.1.102.1 255.255.255.0
       no shutdown
      !
      interface Ethernet0/2
       description PC1 LAN
       ip address 192.168.10.1 255.255.255.0
       no shutdown
      !
      interface Ethernet0/3
       no ip address
       shutdown
      !
      ip as-path access-list 1 permit ^$
      !
      route-map ISP1-IN permit 10
       set local-preference 200
      !
      route-map ISP2-OUT permit 10
       set as-path prepend 65001 65001 65001
      !
      router bgp 65001
       bgp router-id 10.255.255.1
       bgp log-neighbor-changes
       neighbor 10.1.101.101 remote-as 64521
       neighbor 10.1.101.101 description ISP1 (primary)
       neighbor 10.1.101.101 update-source Loopback0
       neighbor 10.1.102.102 remote-as 64512
       neighbor 10.1.102.102 description ISP2 (backup)
       neighbor 10.1.102.102 password isp2-peer
       network 192.168.0.0 mask 255.255.0.0
       neighbor 10.1.102.102 route-map ISP1-IN in
       neighbor 10.1.101.101 filter-list 1 out
       neighbor 10.1.102.102 route-map ISP2-OUT out
       neighbor 10.1.102.102 filter-list 1 out
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
       privilege level 15
      line vty 0 4
       login local
       transport input ssh telnet
      !
      end
