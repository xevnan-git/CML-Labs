hostname R1
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
clock timezone EST -5 0
clock summer-time EDT recurring
service timestamps log datetime msec localtime show-timezone
service timestamps debug datetime msec localtime show-timezone
!
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description NTP1 e0/0
 ip address 10.1.100.1 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/1
 description R2 e0/0
 ip address 10.1.2.1 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description R3 e0/0
 ip address 10.1.3.1 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.1
!
ip access-list standard NTP-PEERS
 10 permit 10.255.255.100
ip access-list standard NTP-CLIENTS
 10 permit 10.255.255.2
 20 permit 10.255.255.3
!
ntp authentication-key 1 md5 NTPsecret
ntp authenticate
ntp trusted-key 1
ntp source Loopback0
ntp access-group peer NTP-PEERS
ntp access-group serve-only NTP-CLIENTS
ntp server 10.255.255.100 key 1
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input telnet ssh
!
end
