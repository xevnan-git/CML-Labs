hostname ISP1
no ip domain lookup
ip domain name lab.local
enable secret cisco
username cisco privilege 15 secret cisco
!
interface Loopback0
 ip address 10.255.255.101 255.255.255.255
!
interface Loopback1
 description internet server (same address at ISP2)
 ip address 203.0.113.100 255.255.255.255
!
interface Ethernet0/0
 description customer R1 e0/2
 ip address 10.1.101.101 255.255.255.0
 no shutdown
!
interface Ethernet0/1
 no ip address
 shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
ip route 192.168.0.0 255.255.0.0 10.1.101.1 name CUSTOMER-LANS
ip route 10.255.255.1 255.255.255.255 10.1.101.1 name CUSTOMER-R1
!
banner motd %
*** internet server 203.0.113.100 -- you reached it through ISP1 ***
%
!
line con 0
 exec-timeout 0 0
 logging synchronous
 privilege level 15
line vty 0 4
 login local
 transport input telnet ssh
!
end
