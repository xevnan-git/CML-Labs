nodes:
- id: n0
  label: R1
  x: 0
  y: 0
  node_definition: iol-xe
  image_definition: iol-xe-17-18-02
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  configuration:
  - name: ios_config.txt
    content: |
      hostname R1
      no ip domain lookup
      ip domain name lab.local
      enable secret cisco
      username cisco privilege 15 secret cisco
      crypto key generate rsa modulus 2048
      !
      interface Loopback0
       ip address 10.255.255.1 255.255.255.255
       ip ospf 1 area 0
      !
      interface Ethernet0/0
       description R2 e0/0 (inside, OSPF)
       ip address 10.1.2.1 255.255.255.0
       ip ospf 1 area 0
       no shutdown
      !
      interface Ethernet0/1
       description ISP1 e0/0 (AS 64511)
       ip address 10.1.101.1 255.255.255.0
       no ip unreachables
       ip access-group IACL-IN in
       no shutdown
      !
      interface Ethernet0/2
       no ip address
       shutdown
      !
      interface Ethernet0/3
       no ip address
       shutdown
      !
      router ospf 1
       router-id 10.255.255.1
       default-information originate always
      !
      router bgp 65001
       bgp router-id 10.255.255.1
       bgp log-neighbor-changes
       neighbor 10.1.101.101 remote-as 64511
       neighbor 10.1.101.101 description ISP1
       neighbor 10.1.101.101 timers 10 30
       network 10.255.255.1 mask 255.255.255.255
       network 192.168.10.0
      !
      ip access-list extended IACL-IN
       10 deny ip 10.0.0.0 0.255.255.255 any
       20 deny ip 172.16.0.0 0.15.255.255 any
       30 deny ip 192.168.0.0 0.0.255.255 any
       40 deny ip 127.0.0.0 0.255.255.255 any
       50 permit tcp host 10.1.101.101 host 10.1.101.1 eq bgp
       60 permit tcp host 10.1.101.101 eq bgp host 10.1.101.1
       70 permit icmp host 10.1.101.101 host 10.1.101.1
       80 permit icmp any host 10.1.101.1 echo
       120 deny ip any host 10.1.101.1
       130 deny ip any host 10.255.255.1
       140 deny ip any 10.1.2.0 0.0.0.255
      ip access-list standard VTY-MGMT
       10 permit 192.168.10.10
       20 deny any log
      !
      ip access-list extended COPP-ROUTING
       10 permit ospf any any
       20 permit tcp any any eq bgp
       30 permit tcp any eq bgp any
       40 permit eigrp any any
      ip access-list extended COPP-MGMT
       20 permit tcp 192.168.10.0 0.0.0.255 any eq telnet
       30 permit tcp 192.168.10.0 0.0.0.255 any eq www
       40 permit tcp 192.168.10.0 0.0.0.255 any eq 443
      ip access-list extended COPP-SNMP
       10 permit udp 192.168.10.0 0.0.0.255 any eq snmp
      ip access-list extended COPP-ICMP
       10 permit icmp any any
      ip access-list extended COPP-CATCHALL
       10 permit ip any any
      !
      class-map match-all CM-ROUTING
       match access-group name COPP-ROUTING
      class-map match-all CM-MGMT
       match access-group name COPP-MGMT
      class-map match-any CM-MONITOR
       match access-group name COPP-SNMP
       match access-group name COPP-ICMP
      class-map match-all CM-CATCHALL
       match access-group name COPP-CATCHALL
      !
      policy-map PM-COPP
       class CM-ROUTING
        police 256000 conform-action transmit exceed-action transmit
       class CM-MGMT
        police 256000 conform-action transmit exceed-action drop
       class CM-MONITOR
        police 16000 conform-action transmit exceed-action drop
       class CM-CATCHALL
        police 8000 conform-action drop exceed-action drop
       class class-default
        police 64000 conform-action transmit exceed-action drop
      !
      control-plane
       service-policy input PM-COPP
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
       privilege level 15
      line vty 0 4
       access-class VTY-MGMT in
       login local
       transport input ssh telnet
      !
      end
